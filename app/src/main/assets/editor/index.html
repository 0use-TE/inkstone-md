<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>墨页</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="vendor/toastui-editor.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="editor" aria-label="Markdown 文档编辑器"></div>
  <footer>
    <div class="mode-switch" role="group" aria-label="文档视图">
      <button id="rich-mode" class="selected" type="button" aria-pressed="true">书写</button>
      <button id="source-mode" type="button" aria-pressed="false">源码</button>
      <select id="source-layout" aria-label="源码布局" hidden>
        <option value="source">仅源码</option>
        <option value="split">分栏预览</option>
        <option value="preview">仅预览</option>
      </select>
      <span id="view-lock" hidden>只读</span>
    </div>
    <span id="count" aria-live="polite">0 字符</span>
  </footer>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/toastui-editor-all.min.js"></script>
  <script src="vendor/zh-cn.js"></script>
  <script src="markdown-utils.js"></script>
  <script src="writing-tools.js"></script>
  <script src="live-preview.js"></script>
  <script src="app.js"></script>
</body>
</html>
